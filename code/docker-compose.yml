services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nabu
      POSTGRES_USER: nabu
      POSTGRES_PASSWORD: nabu
    ports:
      - "5432:5432"
    volumes:
      - nabu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabu -d nabu"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  nabu_postgres:
